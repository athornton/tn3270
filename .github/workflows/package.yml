# Build, test, pack, install-smoke, package and package-smoke on each OS/arch, natively
# (packaging plan, Task 14). Every job runs the same steps; what differs per runner lives in the
# matrix entry, not in `if:` expressions:
#   builder     electron-builder's OS/arch flags for `npm run package:gui --`
#   xvfb        the display wrapper for anything that starts Electron (Linux: xvfb-run at the
#               1280x1024x24 screen the synthetic-ispf golden was recorded on; elsewhere empty)
#   apt         Linux packages to install (empty: none)
#   parity      run the six GUI harnesses on dist/ AND on the bundle (TN3270_GUI_MAIN=app)
#   x64witness  TN3270_PACKAGE_SMOKE_X64 for package-smoke.mjs (see its "macOS" notes)
#   npm         upload the npm tarballs (one job, so they are not uploaded five times)
#   gui         upload this job's native artifacts
#   sign        a SIGNING runner (code signing plan, Task 5; spec docs/superpowers/specs/
#               2026-11-10-code-signing-design.md, section 2): macos-latest only, the one that
#               uploads the mac installers. It signs only on a `v*` tag or a dispatch with `sign`
#               ticked, and always runs verify-signatures.mjs (--expect unsigned otherwise)
#   verify      a FIXED verify-signatures.mjs mode for a runner that never signs: windows-latest,
#               `unsigned` on every run, tags included (spec amendment 2026-11-11: Windows CI
#               signing is dropped; a Microsoft Store MSIX route is planned). A Windows installer
#               that came out signed anyway -- a half-configured signing setup -- fails the run.
#   pty         run packages/tui/scripts/pty-smoke.py (default, --oversize-auto, --prompt) after
#               the build -- a real pty and a fork, which only Linux runners here give it cheaply;
#               the two ubuntu jobs (the parity runner and the Node floor) carry it, so both the
#               newest and the oldest supported Node run it, not every OS/arch.
#   masbuild    also build Electron's MAS app, unsigned (`--mac mas --universal
#               -c.mac.identity=null`), into artifacts/gui/mas-universal/: the store probe's macOS
#               input (store-probe plan Task 6). macos-latest only. After both verify steps, so it
#               cannot disturb what they judge; its own step has no signing env, so it never signs
#               or notarizes, on a signing run too. NEVER uploaded: the gui-* globs are one level
#               deep, and mas-universal/ holds only an app directory.
#   probe       run scripts/store-probe.mjs (store-probe spec, Amendment 2026-11-12) on EVERY run,
#               tags included: the app confined as each store confines it -- macos-latest's
#               App-Sandboxed MAS copy, windows-latest's installed MSIX (the .appx win.target
#               builds) -- must prove its confinement from inside the process and pass
#               package-smoke's two checks. Before package-smoke and the uploads. Nothing it builds
#               is uploaded: no upload path names `.appx` or `mas-universal`.
#
#   node        the Node major/minor this job runs (setup-node)
#   nodeopts    NODE_OPTIONS for the test step only (empty: none)
#
# NODE: 22 on the five packaging runners, and the `engines.node` FLOOR (20.19, Debian 13's packaged
# Node) on one extra Linux job, so CI tests the oldest Node a user may run.
# packages/core/test/manifests.test.ts fails if the oldest `node:` here is not the manifests' floor.
# The floor job stops after install-smoke: it tests the npm packages, and the native artifacts are
# the packaging runners' job. Action majors checked 2026-11-06 against each repo's releases/latest
# (checkout v7.0.1, setup-node v7.1.0, cache v6.1.0, upload-artifact v7.0.2), except
# download-artifact below: v8.0.2, not v7, checked 2026-11-09. upload-artifact and download-artifact
# release in lockstep on the same @actions/artifact backend (both latest releases -- upload v7.0.2,
# download v8.0.2 -- bumped to @actions/artifact 6.3.1 together for the same fix); nothing in either
# changelog back to the v4 artifact-service rewrite says a download major requires the matching
# upload major, so v8 reads what upload-artifact@v7 (used throughout this file) writes.
#
# TRUSTED PUBLISHING (npm trusted publishing plan, Tasks 4-6; design:
# docs/superpowers/specs/2026-11-09-npm-trusted-publishing-design.md). A `vX.Y.Z` tag push runs the
# six matrix jobs above as any push does, then three more:
#   release-check   no `environment:`, so a bad tag or mismatched tarball set fails before anyone
#                   is asked to approve anything. It also pre-flights the GitHub release: the
#                   run's gui-* artifacts must be exactly the seven installers of the tag's version
#                   (release-notes.mjs --check-installers), and CHANGELOG.md must have that
#                   version's entry with no fragment left uncollected (--check-changelog) -- here,
#                   because npm publish cannot be undone and github-release runs after it.
#   publish         `environment: npm`, which GATES on that GitHub environment's required reviewer
#                   approval (and whose deployment policy admits only `v*.*.*` tags), then
#                   publishes over OIDC (no npm token anywhere) and reads the registry back.
#   github-release  after publish (GitHub release design:
#                   docs/superpowers/specs/2026-11-09-github-release-and-changelog-design.md):
#                   creates (or, on a re-run, updates) the GitHub release vX.Y.Z with the run's
#                   installers, a SHA256SUMS and composed notes, then reads it back. NO
#                   environment of its own: the one approval on publish covers it. Its
#                   `contents: write` is this job's only write permission.
# All three are `if: startsWith(github.ref, 'refs/tags/v')`, so a push to main/packaging or a pull
# request runs none -- only the `--dry-run`s (publish.mjs and release-notes.mjs), in the `npm` leg
# of the matrix job below, every time.
#
# NAMES THAT MUST NOT CHANGE: on npmjs.com, each of the eight `@tn3270/*` packages' trusted
# publisher names THIS FILE by its name, `package.yml`, and environment `npm`. Renaming this
# workflow file, or renaming/removing the `npm` GitHub environment referenced by the `publish` job
# below, breaks publishing with no warning until the next tag push.
name: package
on:
  push:
    branches: [main, packaging]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize the macOS app (uses environment signing; Windows is never signed)'
        type: boolean
        default: false
env:
  # Unsigned unless a signing run, whose package:gui step overrides this. `false` with no identity
  # leaves the app unsigned with no error (app-builder-lib codeSign/macCodeSign.js findIdentity), so
  # no run ever signs with whatever certificate a runner's keychain happens to hold.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
defaults:
  run:
    shell: bash
jobs:
  package:
    name: ${{ matrix.name || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: --linux --x64
            xvfb: 'xvfb-run -a -s "-screen 0 1280x1024x24"'
            apt: xvfb libfuse2t64
            parity: true
            pty: true
            node: '22'
            npm: true
            gui: true
          - os: ubuntu-24.04-arm
            builder: --linux --arm64
            xvfb: 'xvfb-run -a -s "-screen 0 1280x1024x24"'
            # The arm64 image ships no Chrome, so unlike the x64 image nothing has pulled in
            # Electron's runtime libraries; on x64 these are already present.
            apt: xvfb libfuse2t64 libgtk-3-0t64 libnss3 libasound2t64 libgbm1
            node: '22'
            gui: true
          - os: macos-latest
            # Apple silicon. Universal comes from electron-builder.cjs `mac.target`.
            builder: --mac
            # The Intel job below runs the x64 slice natively, so this one skips Rosetta.
            x64witness: native
            node: '22'
            gui: true
            # Signs the universal app (macos-26-intel below stays unsigned: never uploaded).
            sign: true
            # The store probe's sandboxed route: the MAS stand-in, built here and probed.
            masbuild: true
            probe: true
          - os: macos-26-intel
            # Builds the universal app too, so its package smoke runs the x86_64 slice natively.
            # Not uploaded: it would duplicate macos-latest's universal artifacts.
            builder: --mac
            node: '22'
          - os: windows-latest
            builder: --win --x64
            node: '22'
            gui: true
            # Never signed in CI (spec amendment 2026-11-11), so verified unsigned on EVERY run.
            verify: unsigned
            # The store probe's MSIX route: the .appx that `--win --x64` builds (win.target).
            probe: true
          - name: ubuntu-latest-node20.19
            os: ubuntu-latest
            xvfb: 'xvfb-run -a -s "-screen 0 1280x1024x24"'
            apt: xvfb
            pty: true
            node: '20.19'
            # Node 20 has the WebSocket client web/test/integration.test.ts drives the gateway with,
            # but only behind this flag (global from 22). The gateway itself does not use it.
            nodeopts: --experimental-websocket
    runs-on: ${{ matrix.os }}
    # Signing runs only (code signing spec, section 2): v* tags, or a dispatch with sign ticked,
    # on the one runner that builds the mac installers. '' = no environment (MEASURED in Task 6).
    environment: ${{ matrix.sign && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'signing' || '' }}
    # contents: read is all the steps need: checkout reads the repository; setup-node's npm
    # cache, actions/cache and upload-artifact use the runner's own ACTIONS_RUNTIME_TOKEN, not
    # GITHUB_TOKEN; package:gui is `--publish never`; the release-notes dry run calls no gh. No
    # id-token: mac signing uses secrets, not OIDC (azure/login, its one user, is gone with
    # Windows signing); publish mints its own.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      # Before `npm ci`: electron's postinstall downloads into the electron cache.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - run: npm ci
      - run: npm run build
      - if: matrix.pty
        name: TUI pty harness (real pty + fork; needs no X)
        run: |
          python3 packages/tui/scripts/pty-smoke.py
          python3 packages/tui/scripts/pty-smoke.py --oversize-auto
          python3 packages/tui/scripts/pty-smoke.py --prompt
      - run: npm run typecheck
      # BEFORE vitest on the npm leg, so the real-scriv tests in releaseNotes.test.ts run here
      # instead of skipping (they skipped until 2026-11-10); the release notes dry run below uses
      # it too. Pinned, as release-check and github-release install it.
      - if: matrix.npm
        run: pipx install scriv==1.8.1
      - run: npx vitest run --reporter=default --reporter=junit --outputFile=vitest-junit.xml
        env:
          NODE_OPTIONS: ${{ matrix.nodeopts }}
      - run: npm run bundle:gui
      - run: npm run pack:npm
      - if: matrix.npm
        name: publish dry run (every push -- exercises scripts/publish.mjs continuously)
        # In a one-segment `tarballs/` directory, EXACTLY as release-check and publish download it: the
        # 0.1.2 tag run failed on a path form (`tarballs/x.tgz`, GitHub shorthand to npm) that this
        # step, run on `artifacts/npm/x.tgz`, could never show.
        run: rm -rf tarballs && cp -r artifacts/npm tarballs && node scripts/publish.mjs --dry-run tarballs
      - run: ${{ matrix.xvfb }} node scripts/install-smoke.mjs
      # The harnesses have never run in CI before. Under xvfb-run DISPLAY is set, so
      # xvfb.mjs ensureDisplay() returns it and starts no Xvfb of its own.
      - if: matrix.parity
        name: GUI harnesses on dist/ and on the bundle
        run: |
          for h in shot keys clicks select transfer connect seam-errors; do
            echo "::group::$h on dist"
            ${{ matrix.xvfb }} node "packages/gui/scripts/$h.mjs"
            echo "::endgroup::"
            echo "::group::$h on app (TN3270_GUI_MAIN=app)"
            TN3270_GUI_MAIN=app ${{ matrix.xvfb }} node "packages/gui/scripts/$h.mjs"
            echo "::endgroup::"
          done
      - if: ${{ matrix.sign && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && runner.os == 'macOS' }}
        name: notarization key (.p8) into RUNNER_TEMP; APPLE_API_KEY is its PATH
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - if: matrix.builder
        run: npm run package:gui -- ${{ matrix.builder }}
        env:
          TN3270_SIGN: ${{ matrix.sign && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && '1' || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.sign && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'true' || 'false' }}
          # Empty outside environment signing; signing.cjs refuses signing mode without them.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      # Fail-closed both ways (spec section 3). The MODE comes from the ref and the input alone, not
      # matrix.sign, so a broken signing expression fails a tag run rather than passing it unsigned.
      - if: matrix.sign
        name: verify signatures
        run: node scripts/verify-signatures.mjs --expect ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'signed' || 'unsigned' }} artifacts/gui
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Raw codesign/spctl/Authenticode text in the log: what a failure is diagnosed from,
          # and where the test fixtures are captured from (Tasks 6 and 8).
          VERIFY_SIGNATURES_ECHO: '1'
      # A runner that never signs (windows-latest): its matrix `verify` mode, on every run, tags
      # included -- never the ref, which would expect `signed` from a build nothing signs.
      - if: matrix.verify
        name: verify signatures (fixed mode)
        run: node scripts/verify-signatures.mjs --expect ${{ matrix.verify }} artifacts/gui
        env:
          VERIFY_SIGNATURES_ECHO: '1'
      # The store probe's macOS input, Electron's MAS build. `-c.mac.identity=null`, not
      # -c.mas.identity: electron-builder coerces the string "null" for config.mac only, and the
      # mas config deep-assigns over mac (macPackager.js getPlatformConfig); a null identity makes
      # no .pkg and leaves artifacts/gui/mas-universal/TN3270.app (spike run 43115293433). NO env:
      # TN3270_SIGN, CSC_LINK and APPLE_API_KEY_ID/ISSUER live in the Developer ID step's env only,
      # and CSC_IDENTITY_AUTO_DISCOVERY stays the global 'false', so signing.cjs is in unsigned
      # mode (identity null, notarize false). On a signing run the .p8 step's APPLE_API_KEY is in
      # GITHUB_ENV here too; unused: unsigned mode turns notarization off, and electron-builder
      # never notarizes a mas build anyway (macPackager.js sign: `if (!isMas)`). After both verify
      # steps, so the dmg/zip they judged (and that are uploaded) are already checked.
      - if: matrix.masbuild
        name: package:gui (MAS stand-in for the store probe, unsigned, never uploaded)
        run: npm run package:gui -- --mac mas --universal -c.mac.identity=null
      # On EVERY run (no ref, input or event in the `if:`): store-probe.mjs's header has the routes.
      # BEFORE package-smoke: on Windows package-smoke ends with an NSIS uninstall that returns at
      # once and finishes in the background, which the MSIX install and alias launch should not
      # race; and the probe starts from a runner nothing has yet launched TN3270 on. Its own
      # cleanup removes the MSIX, the container and its scratch (in RUNNER_TEMP), so package-smoke
      # still meets a clean runner. Before the uploads: nothing it builds is in them.
      - if: matrix.probe
        name: store probe
        run: node scripts/store-probe.mjs artifacts/gui
        env:
          # Every command and its raw output in the log, the pfx password masked.
          STORE_PROBE_ECHO: '1'
      - if: matrix.builder
        run: ${{ matrix.xvfb }} node scripts/package-smoke.mjs
        env:
          TN3270_PACKAGE_SMOKE_X64: ${{ matrix.x64witness }}
      # After package:gui, which makes artifacts/gui: the GitHub release's notes and SHA256SUMS,
      # composed for this runner's own installers with no tag and no network. Changelog problems
      # (no entry for this version, uncollected fragments) are WARNINGS here -- normal between
      # releases -- and refusals in release-check. scriv pinned, as release-check and
      # github-release install it; pipx is on the ubuntu-latest image (runner-images, 2026-11-09).
      - if: matrix.npm
        name: release notes dry run (every push -- exercises scripts/release-notes.mjs continuously)
        run: node scripts/release-notes.mjs --dry-run artifacts/gui
      # A capture that missed the golden is copied here by smoke-lib's judgeShot, so it can be
      # looked at. On Linux any miss fails; elsewhere a size-matching, non-blank capture also lands
      # here as the record of what that OS draws.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-shots-${{ matrix.name || matrix.os }}
          path: artifacts/smoke-shots/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-${{ matrix.name || matrix.os }}
          path: vitest-junit.xml
          if-no-files-found: warn
      - if: matrix.npm
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: artifacts/npm/*.tgz
          if-no-files-found: error
      - if: matrix.gui
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}
          path: |
            artifacts/gui/*.AppImage
            artifacts/gui/*.deb
            artifacts/gui/*.dmg
            artifacts/gui/*.zip
            artifacts/gui/*.exe
          if-no-files-found: error

  release-check:
    # A tag push only. Outside the npm environment, so a bad tag fails before anyone is asked.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    # Generous for a job that downloads the tarballs and the installers (~1 GB: 455 MB macOS, ~222 MB each Linux, 121 MB Windows, run 42723693869), installs scriv,
    # and runs two dependency-free scripts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/download-artifact@v8
        with: { name: npm-tarballs, path: tarballs }
      - run: node scripts/publish.mjs --check tarballs
      # The GitHub release's installers and changelog, checked HERE -- before publish's approval
      # and npm publish, which cannot be undone -- not first in github-release, after it.
      - uses: actions/download-artifact@v8
        with: { pattern: 'gui-*', merge-multiple: true, path: installers }
      - run: node scripts/release-notes.mjs --check-installers installers "${GITHUB_REF_NAME#v}"
      - run: pipx install scriv==1.8.1
      - run: node scripts/release-notes.mjs --check-changelog "${GITHUB_REF_NAME#v}"

  publish:
    # Waits for the npm environment's required reviewer. OIDC: no token anywhere.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-check
    runs-on: ubuntu-latest
    # A GitHub Actions job's timeout-minutes clock does not start until the job leaves "waiting"
    # for its environment's required reviewer -- i.e. the approval wait above is free. What DOES
    # count: checkout, setup-node, the version check, downloading the artifact, and
    # `publish.mjs --publish` itself (up to eight `npm publish`s plus its own ~10-minute read-back
    # deadline). 20 minutes covers that with room for a slow runner or a slow registry.
    timeout-minutes: 20
    environment: npm
    permissions:
      id-token: write
      contents: read
    # Two tag pushes could otherwise both pass release-check and race to publish; this keeps them
    # from running at once. Actions holds at most ONE pending job per group, and a newer pending one
    # cancels the older: with three quick tags the middle publish is cancelled, not queued (harmless
    # -- its tag can be re-run).
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. Node 24 already BUNDLES a new
      # enough npm (24.22.2 ships 11.19.1, 2026-11-09), so this ASSERTS it rather than reinstalling
      # npm over itself -- the self-upgrade was the riskiest untested step, and a failure in this
      # YAML cannot be fixed by "Re-run failed jobs", which replays the tagged commit's file.
      - name: Node and npm are new enough for trusted publishing
        run: |
          node --version && npm --version
          node -e 'const v=(s)=>s.replace(/^v/,"").split(".").map(Number);const ge=(a,b)=>a[0]!==b[0]?a[0]>b[0]:a[1]!==b[1]?a[1]>b[1]:a[2]>=b[2];if(!ge(v(process.version),[22,14,0])||!ge(v(process.argv[1]),[11,5,1])){console.error("trusted publishing needs Node >= 22.14 and npm >= 11.5.1");process.exit(1)}' "$(npm --version)"
      - uses: actions/download-artifact@v8
        with: { name: npm-tarballs, path: tarballs }
      - run: node scripts/publish.mjs --publish tarballs

  github-release:
    # The GitHub release vX.Y.Z, with this run's installers, SHA256SUMS and composed notes. After
    # publish, so a release never exists without its npm packages. No environment: the one
    # approval on publish covers it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    # Downloads ~1 GB of installers, uploads them again, reads the release back.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # fetch-depth 0: the tags and history, for the previous release tag and the commit list.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: pipx install scriv==1.8.1
      - uses: actions/download-artifact@v8
        with: { pattern: 'gui-*', merge-multiple: true, path: installers }
      # Writes installers/SHA256SUMS and release-notes.md (in the repository root, this cwd).
      - run: node scripts/release-notes.mjs --compose installers
        env: { GH_TOKEN: '${{ github.token }}' }
      # A re-run finds the release already there: edit its notes, re-upload with --clobber.
      - name: Create or update the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # A RE-RUN finds the release this job may have half-made. `gh release create` with assets
          # makes a DRAFT, uploads, then publishes; killed mid-upload (timeout, cancel, lost runner)
          # it leaves the draft, and `edit` alone keeps it one -- so upload first, then edit with
          # --draft=false, or every re-run would fail the read-back (which sees only published
          # releases). Review of gh's release/create/create.go, 2026-11-10.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md installers/*
          fi
      - name: Read the release back
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node scripts/release-notes.mjs --verify-release installers
