<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tn3270</title>
<!--
  `overflow:auto`, NOT `hidden`, and that differs deliberately from the Electron page's CSS.
  MEASURED against live VM/370: a 43-row model-4 screen is 616px tall with its OIA, and in a
  shorter viewport `overflow:hidden` put the entire operator status line beyond the edge with
  nothing to reach it by. Electron resizes its window instead; a page cannot, so it scrolls.
  See the matching note in `canvas/src/renderer.ts` about the canvas size.
-->
<style>html,body{margin:0;background:#000;overflow:auto}canvas{display:block}</style>
<!--
  THE SHARED STYLESHEET, the same `ui.css` the GUI's transfer and keypad windows load -- which is
  what the user's "stylistically similar" requirement actually implies, rather than a third copy
  of the same rules. It styles ONLY the keypad overlay here; the two-line canvas style above is
  separate and deliberately so, because the 3270 screen is pixels from an atlas and must stay
  that way.

  AFTER the canvas style, so nothing in it can be overridden by the shared file by accident.
-->
<link rel="stylesheet" href="./ui.css">
<!--
  THE IMPORT MAP, which `bridge.js` needs because it imports two bare specifiers and a browser has
  no bundler to resolve them.

  BOTH NAME A SINGLE MODULE, never a package barrel: `canvas`'s barrel reaches `drawlist.js` and
  `@tn3270/core`, and `frontend`'s reaches `tls.js` and its `node:` builtins. Either would be
  unresolvable here and the page would come up BLANK WITH NO ERROR.

  FLAT PATHS, UNLIKE THE ELECTRON WINDOWS' `../frontend/dist/...`, and that difference is the
  point rather than an inconsistency. An Electron window loads from `file://`, where `..` is a
  real directory; a served page's `..` is a URL the server has to answer. `httpstatic.ts` serves
  all of these at the root, so `keypadView.js`'s own relative imports of `./keypad.js` and
  `./bindings.js` resolve against the same flat root and need no entries of their own.

  TWO DEEP-PATH ENTRIES JOINED 2026-10-06 FOR THE TRANSFER FORM, and they are ADDITIONS rather
  than edits to the two above for a measured reason: an import-map key without a trailing `/`
  matches EXACTLY, so one specifier cannot name two files. `@tn3270/canvas` is already spoken for
  by `keypadUi.js` and `@tn3270/frontend` by `keypadView.js` -- which does NOT export
  `TRANSFER_FIELDS`. Binding the transfer modules by reusing either key would be a resolution
  failure presenting as a BLANK PAGE WITH NO ERROR, the same family as everything else in this
  comment. (Tried on the GUI's own map the same day: the window came up blank and
  `transfer.mjs` scored 3/10, with the renderer's only complaint a bare "Script failed to
  execute".)

  THE KEYS ARE THE STRINGS `tsc` ALREADY RESOLVES, verbatim, so the browser and the compiler
  agree: `transferBoot.ts` imports `@tn3270/canvas/dist/transferUi.js` and `transferUi.ts`
  imports `@tn3270/frontend/dist/transferForm.js`.

  THE TWO DEEP PATHS ARE LEGAL TO `tsc` AND NODE FOR OPPOSITE REASONS, which matters because the
  obvious tidy-up breaks one of them. `@tn3270/frontend/dist/transferForm.js` resolves because
  that package's `exports` map DECLARES the subpath -- deliberately only that one, so
  `dist/tls.js` and its `node:net`/`node:tls`/`node:fs` stay refused by the resolver.
  `@tn3270/canvas/dist/transferUi.js` resolves because `canvas` has NO `exports` FIELD AT ALL:
  see the capitalised warning at `canvas/src/index.ts:73`, which measured that adding one fails
  the build with `TS2307` at `gui/src/transferBoot.ts`. An earlier version of this comment said
  both were declared, which would have sent a reader to "tidy" `canvas/package.json` and blank
  the Electron transfer window.
  The ADDRESSES stay flat at `/`, unlike the GUI's `../frontend/dist/...`, for the reason two
  paragraphs up.

  BOTH DEEP ENTRIES ARE NOW LIVE, 2026-10-07. They were added ahead of their consumer and were
  inert until this day; `bridge.js` now imports `./transferBoot.js`, which imports
  `@tn3270/canvas/dist/transferUi.js` (the first key), which imports
  `@tn3270/frontend/dist/transferForm.js` (the second). Having them in place first is what stopped
  the specifier being the thing that was missing on the day the overlay landed.

  `transferBoot.js`'s OTHER imports need NO entries, and that is the distinction worth keeping
  straight: `./transferBridge.js` and `./transferChunk.js` are RELATIVE, so the browser resolves
  them against this document's own root, where `httpstatic.ts` serves them flat. Only BARE
  specifiers need the map.
-->
<script type="importmap">
{
  "imports": {
    "@tn3270/canvas": "./keypadUi.js",
    "@tn3270/frontend": "./keypadView.js",
    "@tn3270/canvas/dist/transferUi.js": "./transferUi.js",
    "@tn3270/frontend/dist/transferForm.js": "./transferForm.js"
  }
}
</script>
</head><body><canvas id="screen"></canvas>
<!--
  THE KEYPAD OVERLAY, after the canvas in document order and `position: fixed` in `ui.css`.

  BOTH OF THOSE MATTER. Fixed positioning paints it OVER the screen without displacing it, and
  `gui/src/main.ts` records why that is load-bearing rather than tidy: the click path's `offsetX`
  arithmetic depends on the canvas sitting at the viewport origin -- "give the page a body margin
  and every click here misses by it". A sibling in normal flow would push the canvas down and
  break keypad clicks in the OTHER front end, through the renderer both share.

  `hidden` IN THE MARKUP as well as in `createKeypadOverlay`, which sets it again at construction.
  Belt and braces on purpose: either one alone is removable by someone who sees the other, and the
  cost of getting it wrong is a keypad covering the screen on every page load.

  EMPTY OF BUTTONS. All 48 are built by `createKeypadUi` from `KEYPAD_BLOCKS` on the first toggle,
  so this document never spells the key table -- which is what stops it becoming a second,
  drifting copy of it.
-->
<div id="keypad-overlay" hidden>
  <button type="button" class="keypad-close" id="keypad-close">Close</button>
  <h1>Keypad</h1>
  <div id="keypad-keys"></div>
</div>
<!--
  THE TRANSFER OVERLAY. Same two rules as the keypad's, next to it in document order: opaque and
  `position: fixed` in `ui.css`, so it paints over the canvas rather than sitting under it.

  WHAT `position: fixed` BUYS HERE IS NOT WHAT THE KEYPAD'S COMMENT CLAIMS, and `ui.css`'s own
  rule carries the measurement: because this element FOLLOWS the canvas in document order, a
  static one cannot displace it -- measured 2026-10-07 under real Chromium as a byte-identical
  canvas rect and a still-green `browser-shot.mjs`. What broke was the FORM: its top edge at
  y=773 in a 773px viewport, entirely below the fold, with `elementFromPoint` over Start
  returning `null`. The 15px canvas displacement is real and belongs to `ui.css` styling `body`,
  which is why those rules are scoped; it is not what this line prevents.

  Opaque rather than translucent because these are EDITABLE FIELDS over a logged-on host screen,
  which is worse to read through than the read-only chord column the TUI once leaked into.

  `hidden` IN THE MARKUP as well as in `createTransferOverlay`, which sets it again at
  construction. Belt and braces on purpose, exactly as for the keypad above: either one alone is
  removable by someone who sees the other, and the cost of getting it wrong is a form covering the
  screen on every page load.

  THE IDS ARE PREFIXED `transfer-`, which matters here and not in the Electron GUI: the keypad and
  the transfer form share ONE document in this front end, so an unprefixed `#close` or `#status`
  would collide with the keypad's. The field rows' ids are prefixed by `transferBoot.ts` from
  `UiField.id` for the same reason.

  EMPTY OF FIELD ROWS. All ten are drawn into `#transfer-fields` by `createTransferUi` through
  `transferBoot.ts`'s `render`, from `TRANSFER_FIELDS` and the applicability rules -- so this
  document never spells the field table, which is what stops it becoming a second, drifting copy.

  `type="button"` ON EVERY BUTTON IS EXPLICIT AND LOAD-BEARING: a bare `<button>` defaults to
  `type="submit"`, which `keypadUi.ts` records as the trap that would turn a key press into a page
  reload. There is no `<form>` element here, so no submit has anywhere to go today -- which is
  precisely what would make the omission invisible until someone wrapped these in one.

  THE `Save…` BUTTON EXISTS BECAUSE THE SAVE PICKER NEEDS TRANSIENT USER ACTIVATION, and cannot be
  opened from the completion callback: the click that started the transfer is spent by the time
  `transferDone` arrives. So a receive ends with this button ENABLED and the operator's click on it
  is what opens the dialog. It starts `disabled` because there is nothing to save until then.

  THE FILE INPUT IS `hidden` AND DRIVEN BY THE Browse BUTTON. A styled `<input type="file">` is not
  possible across browsers, and the click on Browse is the user gesture the chooser needs; a
  `hidden` input still opens one from a scripted `click()`.
-->
<div id="transfer-overlay" hidden>
  <h1>File transfer</h1>
  <div id="transfer-fields"></div>
  <p id="transfer-status"></p>
  <div id="transfer-buttons">
    <button type="button" id="transfer-browse">Browse…</button>
    <button type="button" id="transfer-start">Start</button>
    <button type="button" id="transfer-cancel" disabled>Cancel</button>
    <button type="button" id="transfer-save" disabled>Save…</button>
    <button type="button" id="transfer-close">Close</button>
  </div>
  <input type="file" id="transfer-file" hidden>
</div>
<!--
  ORDER MATTERS. Module scripts execute in document order, and `renderer.js` reads
  `window.tn3270` in its module body, so the bridge must install it first. `bridge.js` ALSO
  queues messages that arrive before the renderer registers its handlers -- see bridgecore.ts;
  without that queue the atlas can be delivered to nobody and the canvas stays black with no error.
-->
<script type="module" src="./bridge.js"></script>
<script type="module" src="./renderer.js"></script>
</body></html>
