<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>File Transfer</title>
<!--
  The import map is what lets these modules name packages while a browser resolves them. A bare
  specifier is unresolvable in a browser and there is NO BUNDLER here: the window would go blank
  with no error, which this repo has met five separate ways.

  TWO ENTRIES, AND BOTH POINT AT A SINGLE MODULE RATHER THAN A PACKAGE BARREL, exactly as
  `keypad.html` does.

  `@tn3270/frontend/dist/transferForm.js` -> `packages/frontend/dist/transferForm.js`, which has
  no runtime imports of its own (measured 2026-10-01: 9139 bytes, zero) -- so that branch closes
  at one file.

  THAT KEY WAS THE BARE `@tn3270/frontend` UNTIL 2026-10-06, and it had to change in step with
  `transferUi.ts`'s import. The web gateway became the second consumer of that module, and ITS
  page had already bound the bare `@tn3270/frontend` to `keypadView.js` for the keypad overlay --
  so `transferUi.ts` had to name the deep path instead, and a bare key here would then have
  matched nothing. (Keys match EXACTLY without a trailing `/`; see the paragraph below, which
  measured exactly that mistake on the OTHER entry.) `packages/frontend/package.json`'s `exports`
  map declares that subpath so `tsc` and Node resolve the same string a browser does.

  `@tn3270/canvas/dist/transferUi.js` -> the matching file in `canvas`, where the form's view moved
  on 2026-10-06 because the WEB GATEWAY needs it and `packages/web` neither depends on
  `@tn3270/gui` nor could -- that package imports `electron`. NOT `../canvas/dist/index.js`: the
  canvas BARREL reaches `drawlist.js`, which value-imports `@tn3270/core`, and the barrel's own
  docstring says so in capitals. `transferUi.js` has exactly one runtime import, resolved by the
  first entry, so the graph stays at two files.

  THE KEY IS THE WHOLE DEEP SPECIFIER, NOT THE BARE PACKAGE NAME, and that is MEASURED: an import
  map key without a trailing `/` matches EXACTLY, so a `"@tn3270/canvas"` entry does not resolve
  the `@tn3270/canvas/dist/transferUi.js` that `transferBoot.js` actually emits. Tried on
  2026-10-06 -- the window came up blank and `transfer.mjs` scored 3/10, with the renderer's only
  complaint a bare "Script failed to execute". The key here is the specifier verbatim; a
  `"@tn3270/canvas/"` prefix mapping would also work and maps more than is wanted.
  (`keypad.html` differs legitimately: `keypadBoot.js` imports the BARE name, so a bare key is
  right there. The two documents are not copies of each other.)

  A map address resolves against the DOCUMENT's base URL, not against the importing module's, so
  `../frontend/...` and `../canvas/...` are relative to this file in `packages/gui/` even though
  the importer that names them lives a directory deeper in `packages/gui/dist/`.

  This reaches across packages exactly as `index.html` does for `../canvas/dist/renderer.js`, and
  carries the same caveat: it assumes `gui`, `frontend` and `canvas` stay siblings on disk, which
  is true in the workspace and false in an asar bundle. Packaging has to rewrite all three.
-->
<script type="importmap">
{ "imports": {
    "@tn3270/frontend/dist/transferForm.js": "../frontend/dist/transferForm.js",
    "@tn3270/canvas/dist/transferUi.js": "../canvas/dist/transferUi.js"
} }
</script>
<!--
  THE SHARED STYLESHEET, not an inlined copy. `ui.css` carries these rules verbatim -- including
  the note on why there is deliberately no `#status.error` rule, which is the part that stops it
  being re-added by someone who only sees the markup.

  EXTRACTED 2026-10-06 because the keypad window needs the same chrome: the user's requirement is
  that the two look stylistically similar, and the web gateway's keypad overlay makes a third
  surface. Three copies of one `font:` declaration diverge the first time anybody touches one.

  A PLAIN RELATIVE PATH, resolved against THIS document in `packages/gui/` -- where `ui.css` also
  lives. Note that is a different base from the import map above, whose address reaches up into
  `../frontend/`: a map address resolves against the document's base URL too, but the module that
  USES it sits a directory deeper in `dist/`, which is what makes the `../` there look wrong and
  be right.
-->
<link rel="stylesheet" href="./ui.css">
</head>
<body class="ui-surface">
  <h1>File Transfer (IND$FILE)</h1>
  <div id="fields"></div>
  <div id="status"></div>
  <!--
    These two `disabled` attributes ARE the initial running state. `createTransferUi` calls
    `redraw()` and `show()` before it returns but never `deps.setRunning(false)`, so nothing in
    JavaScript establishes the idle enablement -- the markup has to, and it must agree with
    `transferBoot.ts`'s module-level `running = false`.
  -->
  <div id="buttons">
    <button id="cancel" disabled>Cancel</button>
    <button id="start">Start</button>
  </div>
  <script type="module" src="./dist/transferBoot.js"></script>
</body></html>
