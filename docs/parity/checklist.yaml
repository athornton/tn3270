# The x3270 parity checklist. Rules: docs/superpowers/specs/2026-11-17-x3270-parity-checklist-design.md
# --- connection ---
- id: connect-host
  area: connection
  title: Connect to a host, from the command line or a Connect dialog
  covers: [action:Connect, action:Open, menu:otherHostOption, resource:hostname]
  x3270: "Connect menu → Other… dialog (whenever disconnected); Connect()/Open() actions; positional host or the hostname resource"
  gui: "positional [prefix:][LU,LU@]host[:port]; dialog: Connect, only at a launch with no host"
  status: partial
  gap: "the Connect dialog opens only at a launch with no host; a running or disconnected session cannot connect to a different host (no Connect menu or File → Connect… item, README *What is not implemented*), and only Enter/Clear reconnects to the same one"
  evidence:
    code: [packages/gui/src/connectDialog.ts:45, packages/gui/src/connectDialog.ts:84, packages/frontend/src/hostspec.ts:140]
    tests: [packages/gui/test/connectDialog.test.ts, packages/gui/test/connectAttempt.test.ts, packages/frontend/test/hostspec.test.ts]
    live: "Connect dialog retry and the TUI prompt — verified live 2026-11-09, branch `connect-retry`"
  browser: "the gateway's own command line picks the host (host:port only); the page has no connect dialog"
  others: {tui: "positional host, or the no-host connect prompt", cli: "Connect(host)"}
- id: disconnect
  area: connection
  title: Disconnect from the host
  covers: [action:Disconnect, action:Close, menu:disconnectOption]
  x3270: "File menu → Disconnect; Disconnect()/Close() actions"
  gui: "menu: Model → Disconnect"
  status: partial
  gap: "the Disconnect item lives in the Model menu, not File, so a --terminal-type session, which has no Model menu, has no way to disconnect; and it cannot cancel a connect in flight (x3270's Disconnect is enabled whenever PCONNECTED, including resolving/pending; x3270/menubar.c:650, include/globals.h:282)"
  evidence:
    code: [packages/gui/src/menu.ts:304, packages/gui/src/main.ts:1472, packages/core/src/session.ts:903]
    tests: [packages/gui/test/menu.test.ts, packages/core/test/session.test.ts]
    live: unwitnessed
  browser: "the Alt-M picker has a Disconnect button (witnessed by the user on a Mac, 2026-11-05)"
  others: {cli: "Disconnect()"}
- id: reconnect
  area: connection
  title: Reconnect to the last host
  covers: [action:Reconnect]
  x3270: "Reconnect() action (keymap or script; no menu item)"
  gui: "key: Enter or Clear while disconnected (a deliberate divergence: x3270 binds no key)"
  status: ours
  evidence:
    code: [packages/frontend/src/actions.ts:147, packages/core/src/session.ts:987]
    tests: [packages/frontend/test/actions.test.ts, packages/core/test/session.test.ts]
    live: unwitnessed
  browser: "the same Enter/Clear reconnect, through the shared applyAction"
  others: {tui: "Enter or Ctrl-C while disconnected", cli: "Reconnect()"}
