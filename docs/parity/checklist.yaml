- id: script-stdin
  area: scripting
  title: Accept script commands on standard input
  covers: [option:-script, resource:scriptedAlways]
  x3270: "-script reads s3270-protocol commands on stdin (x3270/x3270.c:197, :285; stdin_init from peer_script_init, Common/task.c:950-956); -scriptport, -socket and -httpd each turn it off (Common/task.c:915, :930, :946-948) unless scriptedAlways, default false (x3270/resources.c:310-311)"
  gui: "none: no flag reads commands from stdin (the TN3270_GUI_KEYS test seam is an environment variable, read at packages/gui/src/main.ts:85 and documented at :1969, not a stdin interface or a feature)"
  status: skipped
  category: declined
  reason: "A GUI started from Finder or the Start menu has no stdin to read commands from, so -script only serves a GUI started from a shell, which the CLI, reading s3270-style commands on stdin (README.md:961), already serves; skipping it costs x3270 scripts that drive a visible window."
  decided: "2026-11-17, user"
  browser: "none"
  others: {cli: "stdin is the CLI's whole interface: one s3270-style command per line, a status line and ok/error after each (packages/cli/src/main.ts:227); no scriptedAlways"}
- id: script-port
