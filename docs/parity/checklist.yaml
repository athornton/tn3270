- id: erase-backspace
  area: keyboard
  title: Backspace (destructive Erase, and BackSpace's cursor-left)
  covers: [action:Erase, action:BackSpace]
  x3270: "the BackSpace key is Erase(), which deletes the character to the left and closes up the field (x3270/fb-x3270:294, Common/kybd.c:2374); BackSpace() is a non-destructive cursor-left (Common/kybd.c:2285)"
  gui: "key: Backspace; keypad BkSp button"
  status: partial
  gap: "Backspace nulls the cell to its left and leaves the gap rather than shifting the rest of the field left as x3270's Erase does; it also edits a host-locked keyboard, where x3270 queues the key. The CLI's BackSpace() erases, where s3270's BackSpace() only moves the cursor"
  evidence:
    code: [packages/canvas/src/keys.ts:98, packages/core/src/keyboard.ts:398]
    tests: [packages/core/test/keyboard.test.ts]
    live: unwitnessed
  browser: "the same Backspace and keypad button"
  others: {tui: "Backspace", cli: "BackSpace() (destructive, unlike s3270's)"}
