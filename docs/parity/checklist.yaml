- id: new-environ
  area: connection
  title: NEW-ENVIRON (telnet option 39) on by default
  covers: [resource:newEnviron]
  x3270: "newEnviron resource (on by default)"
  gui: "on only when -devname is given"
  status: partial
  gap: "option 39 is refused unless -devname is given, where x3270 accepts a host's DO NEW-ENVIRON by default (Common/telnet.c:1913-1922); CHARSET and KBDTYPE are never sent"
  evidence:
    code: [packages/core/src/telnet.ts:445, packages/core/src/newenviron.ts:195]
    tests: [packages/core/test/newenviron.test.ts, packages/core/test/telnet.test.ts]
- id: user-name
  area: connection
  title: User name sent as NEW-ENVIRON USER (RFC 4777)
  covers: [option:-user]
  x3270: "-user <name>"
  gui: none
  status: partial
  gap: "no -user flag: USER is always the local account ($USER, then $USERNAME, then UNKNOWN), and only when -devname enables option 39. Core already takes SessionOptions.user (core/src/session.ts:122), so only the flag is missing"
  evidence:
    code: [packages/core/src/session.ts:720, packages/core/src/session.ts:122]
