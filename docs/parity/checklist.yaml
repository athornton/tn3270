  gap: "an AID pressed while the keyboard is locked goes straight to the host (Session.sendAID has no lock check), where x3270 queues it and sends it at unlock, or drops it on X -f (PF_action/PA_action/Enter_action/Clear_action, Common/kybd.c:929, :954, :2832, :2876)"
