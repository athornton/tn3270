  x3270: "Script(program[,args]) action, from a keymap, a macro or another script, forks a child with X3270OUTPUT/X3270INPUT pipes, a loopback httpd URL and a script port in its environment, and locks the keyboard while it runs (Common/childscript.c:1128, :1312-1319, :1473); CloseScript ends the script's connection (Common/task.c:4036)"
