- id: tls-port-992
  area: connection
  title: Port 992 implies TLS
  covers: [resource:tls992]
  x3270: "tls992 resource (on by default)"
  gui: "n/a: TLS is the default on every port"
  status: proposed-skipped
  category: n/a
  reason: "TLS is already on for every port unless -insecure (or an unticked TLS box) turns it off, so port 992 needs no rule of its own; the one difference is that we honour an explicit -insecure at 992."
- id: terminal-name
  area: connection
  title: Send a given string as the telnet TERMINAL-TYPE
  covers: [option:-tn]
  x3270: "-tn <name>"
  gui: "flag: --terminal-type (spelled differently from x3270's -tn); its live witness was a CLI run"
  status: partial
  gap: "--terminal-type also discards -model's screen size (24x80 only) and the Model/Disconnect menu, refuses -oversize, and replaces the TN3270E DEVICE-TYPE, where x3270's -tn changes only TERMINAL-TYPE (Common/telnet.c:2121-2122)."
  evidence:
    code: [packages/core/src/termtype.ts:115, packages/core/src/termtype.ts:104, packages/gui/src/args.ts:136, packages/gui/src/main.ts:1380, packages/gui/src/menu.ts:417, packages/core/src/session.ts:1297]
    tests: [packages/core/test/termtype.test.ts, packages/gui/test/args.test.ts]
    live: "2. The selector rides on the TERMINAL-TYPE string, not on an LU name"
  browser: "the gateway does not accept --terminal-type"
  others: {tui: "--terminal-type", cli: "--terminal-type"}
