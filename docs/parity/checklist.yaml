  x3270: "-scriptport [addr:]port listens for s3270-protocol peers, -scriptportonce accepts one then exits, -socket listens on /tmp/x3sck.<pid> (x3270/x3270.c:201-203, :288-291; Common/task.c:906-944); scriptPort is also an extended toggle, so Set(scriptPort,...) opens one at run time (Common/task.c:656); clients are typically x3270if"
  gui: "none"
  status: deferred
  category: declined
  reason: "The user wants GUI scripting kept for someday (2026-11-17), so this is deferred rather than skipped. When it is built, a listening control port needs network.server on the Mac (docs/releasing.md:693) and a store-probe check (docs/releasing.md:808)."
  decided: "2026-11-17, user"
  browser: "none"
  others: {cli: "none: stdin only (packages/cli/src/main.ts:227)"}
