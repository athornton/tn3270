- id: aid-keys
  area: keyboard
  title: Enter, Clear, PF1-PF24 and PA1-PA3
  covers: [action:Enter, action:Clear, action:PF, action:PA]
  x3270: "Return, F1-F12, Shift/Alt-F1-F12, Alt-1/2/3, Alt-C (x3270/fb-x3270:215-305); keypad buttons; Enter()/Clear()/PF(n)/PA(n) actions"
