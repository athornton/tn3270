  title: IND$FILE file transfer (CUT and DFT), from a dialog or the Transfer() action
  covers: [action:Transfer, menu:ftOption]
  x3270: "File → File Transfer… dialog, enabled in 3270 mode (x3270/menubar.c:1131), with local/host file, send/receive, ascii/binary, append, recfm, lrecl, blksize, vm/tso/cics, cr, remap, allocation units, primary/secondary space, avblock, buffer size and other options (x3270/ft_gui.c:212-843), an overwrite prompt (x3270/ft_gui.c:1166-1173) and a progress popup; Transfer() keywords (Common/ft.c:207, :141-162); defaults receive, tso, ascii, cr and remap on, exist keep (Common/ft.c:318-325)"
  gui: "keys: Ctrl-T, or the keypad's Xfer button, open the File Transfer window (direction, host tso/vm, local file with Browse…, host file, mode, exist, cr, recfm, lrecl, blksize, Start/Cancel, a running byte count); no menu item"
  status: partial
  gap: "(1) deliberate default divergences: Direction=send and Mode=binary in the window and in Transfer(), where x3270 opens on receive and ascii (Common/ft.c:319-321; README *File transfer*); (2) no Host=cics, Remap, Allocation, PrimarySpace, SecondarySpace, Avblock or OtherOptions anywhere (frontend/src/transfer.ts:356), and the window has no BufferSize field; (3) there is no Remap translation (core/src/ft/cut.ts:29); (4) a receive with Exist=keep onto an existing file is refused, where x3270 asks to overwrite; and the window's Exist default on a send is replace while the keyword parser's is keep (frontend/src/transfer.ts:519-525), though both replace the host file on a send; (5) no File menu item, only Ctrl-T and the keypad button. Store: the file dialogs need files.user-selected.read-write, which no store-probe check exercises yet (docs/releasing.md:808-813), and a path typed into Local file rather than picked may be outside the sandbox"
